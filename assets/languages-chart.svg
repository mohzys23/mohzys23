<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-label="Languages and technology usage chart">
  <style>
    .title{font:700 18px Arial, sans-serif; fill:#0f172a}
    .label{font:600 12px Arial, sans-serif; fill:#0f172a}
    .percent{font:600 12px Arial, sans-serif; fill:#fff}
  </style>

  <rect x="0" y="0" width="900" height="180" rx="8" fill="#ffffff" />
  <rect x="8" y="8" width="884" height="164" rx="6" fill="#fbfdff" stroke="#e6edf3"/>

  <text x="36" y="40" class="title">Languages &amp; Tech — Top languages across public repositories</text>

  <!-- Simple stacked bar -->
  <g transform="translate(36,64)">
    <rect x="0" y="0" width="220" height="34" rx="6" fill="#563d7c" />
    <rect x="220" y="0" width="180" height="34" fill="#f1e05a" />
    <rect x="400" y="0" width="160" height="34" fill="#3572A5" />
    <rect x="560" y="0" width="80" height="34" fill="#e34c26" />
    <rect x="640" y="0" width="180" height="34" rx="6" fill="#6B7280" />

    <text x="12" y="22" class="percent">CSS — 25%</text>
    <text x="236" y="22" style="fill:#111827; font:600 12px Arial, sans-serif;">JavaScript — 20%</text>
    <text x="420" y="22" class="percent">Python — 19%</text>
    <text x="572" y="22" class="percent">HTML — 10%</text>
    <text x="680" y="22" class="percent">Other — 26%</text>
  </g>

  <g transform="translate(36,114)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#563d7c" />
    <text x="20" y="10" class="label">CSS</text>
    <rect x="120" y="0" width="12" height="12" rx="2" fill="#f1e05a" />
    <text x="140" y="10" class="label">JavaScript</text>
    <rect x="260" y="0" width="12" height="12" rx="2" fill="#3572A5" />
    <text x="280" y="10" class="label">Python</text>
    <rect x="360" y="0" width="12" height="12" rx="2" fill="#e34c26" />
    <text x="380" y="10" class="label">HTML</text>
    <rect x="500" y="0" width="12" height="12" rx="2" fill="#6B7280" />
    <text x="520" y="10" class="label">Other / Unspecified</text>
  </g>

  <text x="36" y="168" class="label">This is a simple, static chart. Ask me to regenerate with exact repo language stats or enable scheduled updates.</text>
</svg>
